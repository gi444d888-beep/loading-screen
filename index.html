<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PARANOIASIM // INTO THE WIRED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #030406;
            --panel-bg: rgba(10, 12, 16, 0.96);
            --accent-gray: #b0b7c6;
            --light-gray: #f8fafc;
            --dark-gray: #090c10;
            --border-gray: #2a303c;
            --glow-gray: rgba(240, 245, 255, 0.45);
            --glitch-red: rgba(255, 0, 60, 0.9);
            --glitch-blue: rgba(0, 225, 255, 0.9);
        }

        body {
            height: 100vh;
            background: var(--bg-color);
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--light-gray);
            perspective: 1000px;
        }

        /* КНОПКА ЗВУКА */
        .audio-controls {
            position: fixed !important;
            top: 20px !important;
            left: 20px !important;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
            background: rgba(4, 5, 7, 0.92);
            border: 2px solid var(--accent-gray);
            padding: 12px 22px;
            border-radius: 2px;
            cursor: pointer;
            z-index: 9999999 !important;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.95), 0 0 12px var(--glow-gray);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .audio-controls:hover {
            border-color: #ffffff;
            background: rgba(20, 24, 32, 0.98);
            transform: scale(1.1) rotate(-1deg);
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 20, 24, 0) 50%, rgba(0, 0, 0, 0.85) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
            animation: scanlineFlicker 0.06s infinite alternate;
        }

        @keyframes scanlineFlicker {
            0% { opacity: 0.85; }
            100% { opacity: 1; }
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 250px rgba(0, 0, 0, 0.98);
            z-index: 9;
            pointer-events: none;
        }

        .glitch-bar {
            position: absolute;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 11;
            pointer-events: none;
            opacity: 0;
        }

        #matrix-canvas, #nodes-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        #matrix-canvas { z-index: 1; opacity: 0.2; }
        #nodes-canvas { z-index: 2; }

        /* Главный интерфейс */
        .interface {
            position: relative;
            z-index: 8;
            width: 90%;
            max-width: 1040px;
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--border-gray);
            padding: 45px;
            box-shadow: 0 0 120px rgba(0, 0, 0, 0.98), inset 0 0 50px rgba(255, 255, 255, 0.02);
            border-radius: 3px;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            animation: interfaceEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes interfaceEntrance {
            0% { opacity: 0; transform: scale(0.85) translateY(50px) rotateX(15deg); filter: blur(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0) rotateX(0deg); filter: blur(0); }
        }

        .interface::before, .interface::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid var(--accent-gray);
            transition: all 0.1s ease;
        }
        .interface::before { top: -4px; left: -4px; border-right: 0; border-bottom: 0; }
        .interface::after { bottom: -4px; right: -4px; border-left: 0; border-top: 0; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gray);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 54px;
            height: 54px;
            border-radius: 3px;
            border: 1px solid var(--accent-gray);
            background: var(--dark-gray);
            filter: grayscale(85%);
            transition: all 0.3s ease;
        }

        .avatar:hover {
            filter: grayscale(0%);
            transform: scale(1.08) rotate(2deg);
            box-shadow: 0 0 20px var(--glow-gray);
        }

        .user-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #6b7280;
        }

        .username {
            color: var(--light-gray);
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 10px var(--glow-gray);
        }

        .system-stats {
            font-size: 10px;
            color: #6b7280;
            text-align: right;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .system-stats span {
            color: var(--accent-gray);
            font-weight: bold;
        }

        .title-box {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .glitch-title {
            font-size: 74px;
            font-weight: 900;
            letter-spacing: 18px;
            text-transform: uppercase;
            color: #ffffff;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.5);
            animation: titleFloat 4s infinite ease-in-out alternate;
        }

        @keyframes titleFloat {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-4px) rotate(0.5deg); }
        }

        .glitch-title::before, .glitch-title::after {
            content: "PARANOIASIM";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch-title::before {
            left: -4px;
            text-shadow: 4px 0 var(--glitch-red);
            animation: glitchAnim1 0.7s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: 4px;
            text-shadow: -4px 0 var(--glitch-blue);
            animation: glitchAnim2 0.9s infinite linear alternate-reverse;
        }

        @keyframes glitchAnim1 {
            0% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.6deg); }
            20% { clip: rect(50px, 9999px, 70px, 0); transform: skew(-0.8deg); }
            40% { clip: rect(0px, 9999px, 20px, 0); transform: skew(1deg); }
            60% { clip: rect(40px, 9999px, 60px, 0); transform: skew(-0.4deg); }
            80% { clip: rect(20px, 9999px, 40px, 0); transform: skew(0.7deg); }
            100% { clip: rect(30px, 9999px, 50px, 0); transform: skew(-0.9deg); }
        }

        @keyframes glitchAnim2 {
            0% { clip: rect(40px, 9999px, 60px, 0); transform: skew(-0.5deg); }
            20% { clip: rect(10px, 9999px, 30px, 0); transform: skew(0.8deg); }
            40% { clip: rect(60px, 9999px, 80px, 0); transform: skew(-0.3deg); }
            60% { clip: rect(20px, 9999px, 40px, 0); transform: skew(0.6deg); }
            80% { clip: rect(30px, 9999px, 50px, 0); transform: skew(-0.8deg); }
            100% { clip: rect(15px, 9999px, 35px, 0); transform: skew(0.4deg); }
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 12px;
            color: var(--accent-gray);
            text-transform: uppercase;
            margin-top: 8px;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* ДВУХСТОРОННИЙ ВИЗУАЛИЗАТОР */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            height: 60px;
            margin-bottom: 25px;
        }

        .bar {
            width: 6px;
            background: linear-gradient(180deg, #ffffff, var(--accent-gray), #11141a);
            box-shadow: 0 0 15px var(--glow-gray);
            border-radius: 1px;
            transition: height 0.03s cubic-bezier(0, 0, 0.2, 1);
        }

        .terminal {
            background: rgba(5, 6, 8, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            height: 90px;
            overflow: hidden;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-radius: 2px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.95);
        }

        .terminal-line {
            margin-top: 4px;
            white-space: nowrap;
            animation: lineType 0.25s ease-out forwards;
        }

        @keyframes lineType {
            from { opacity: 0; transform: translateX(-12px); filter: blur(4px); }
            to { opacity: 1; transform: translateX(0); filter: blur(0); }
        }

        .terminal-line::before {
            content: "[WIRED] > ";
            color: #ffffff;
            font-weight: bold;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .progress-box {
            width: 100%;
            background: #06070a;
            border: 1px solid var(--border-gray);
            padding: 4px;
            border-radius: 2px;
            position: relative;
        }

        .progress-bar {
            height: 12px;
            width: 0%;
            background: linear-gradient(90deg, #1f242d, #9ca3af, #ffffff);
            transition: width 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 0 25px var(--glow-gray);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; width: 10px;
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        .track-info {
            text-align: center;
            font-size: 10px;
            color: #6b7280;
            letter-spacing: 2px;
        }

        .track-info span {
            color: var(--light-gray);
            font-weight: bold;
        }
    </style>
</head>
<body onclick="forceStartAudio()" onmousemove="handleMouseMove(event)" onkeydown="forceStartAudio()">

    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <button class="audio-controls" id="mute-btn" onclick="toggleMusic(event)">
        🔊 [ МУЗЫКА: ВКЛ ]
    </button>

    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="glitch-bar" id="glitch-bar"></div>

    <canvas id="matrix-canvas"></canvas>
    <canvas id="nodes-canvas"></canvas>

    <div class="interface" id="main-ui">
        <div class="header">
            <div class="user-info">
                <img id="avatar" class="avatar" src="https://i.imgur.com/839598X.png" alt="Steam Avatar">
                <div class="user-text">
                    ПОЛЬЗОВАТЕЛЬ<br>
                    <span id="username" class="username">GOREMAN</span>
                </div>
            </div>
            <div class="system-stats">
                СИСТЕМА: <span>PARANOIASIM / WIRED</span><br>
                ПИНГ: <span id="ping">16 ms</span> | FPS: <span id="fps">60</span>
            </div>
        </div>

        <div class="title-box">
            <div class="glitch-title">PARANOIASIM</div>
            <div class="subtitle">INTO THE WIRED // GRAY EDITION</div>
        </div>

        <div class="visualizer" id="visualizer"></div>

        <div class="terminal" id="terminal">
            <div class="terminal-line">Инициализация Paranoiasim Engine v2.0...</div>
            <div class="terminal-line">Синхронизация кибернетической сети прошла успешно.</div>
        </div>

        <div class="progress-container">
            <div class="progress-header">
                <span id="status">ЗАГРУЗКА РЕСУРСОВ...</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-box">
                <div class="progress-bar" id="bar"></div>
            </div>
        </div>

        <div class="track-info">
            ТРЕК: <span>emotionalpastel - ode 2 1em0xx (into the wired)</span>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');
        music.volume = 0.55;

        let audioCtx, analyser, dataArray;
        let started = false;

        function forceStartAudio() {
            if (started) return;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(music);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                renderVisualizer();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            music.play().then(() => {
                started = true;
                muteBtn.innerText = "🔊 [ МУЗЫКА: ВКЛ ]";
            }).catch(() => {});
        }

        function toggleMusic(e) {
            if (e) e.stopPropagation();
            forceStartAudio();
            if (music.paused) {
                music.play();
                muteBtn.innerText = "🔊 [ МУЗЫКА: ВКЛ ]";
            } else {
                music.pause();
                muteBtn.innerText = "🔇 [ МУЗЫКА: ВЫКЛ ]";
            }
        }

        // --- ИНТЕРАКТИВНЫЙ 3D-ПАРАЛЛАКС ИНТЕРФЕЙСА ---
        const uiPanel = document.getElementById('main-ui');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        function handleMouseMove(e) {
            forceStartAudio();
            mouseX = e.clientX;
            mouseY = e.clientY;

            const rotX = (window.innerHeight / 2 - mouseY) / 45;
            const rotY = (mouseX - window.innerWidth / 2) / 45;

            uiPanel.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
        }

        // --- ЦИФРОВОЙ ДОЖДЬ (MATRIX / WIRED RAIN) ---
        const mCanvas = document.getElementById('matrix-canvas');
        const mCtx = mCanvas.getContext('2d');
        mCanvas.width = window.innerWidth;
        mCanvas.height = window.innerHeight;

        const chars = '01XYZPARANOIASIMWIRED456789';
        const fontSize = 12;
        const columns = Math.floor(mCanvas.width / fontSize);
        const drops = Array(columns).fill(1);

        function drawMatrix() {
            mCtx.fillStyle = 'rgba(3, 4, 6, 0.15)';
            mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
            mCtx.fillStyle = '#a1a8b8';
            mCtx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                mCtx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > mCanvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();

        // --- НОВОЕ: ИНТЕРАКТИВНАЯ СЕТЬ КИБЕР-УЗЛОВ (NODE CYBER-GRID) ---
        const nCanvas = document.getElementById('nodes-canvas');
        const nCtx = nCanvas.getContext('2d');
        nCanvas.width = window.innerWidth;
        nCanvas.height = window.innerHeight;

        let nodes = [];
        for (let i = 0; i < 75; i++) {
            nodes.push({
                x: Math.random() * nCanvas.width,
                y: Math.random() * nCanvas.height,
                vx: (Math.random() - 0.5) * 1.2,
                vy: (Math.random() - 0.5) * 1.2,
                radius: Math.random() * 2 + 1
            });
        }

        function drawNodes() {
            nCtx.clearRect(0, 0, nCanvas.width, nCanvas.height);

            nodes.forEach((node, i) => {
                node.x += node.vx;
                node.y += node.vy;

                if (node.x < 0 || node.x > nCanvas.width) node.vx *= -1;
                if (node.y < 0 || node.y > nCanvas.height) node.vy *= -1;

                // Притягивание к мыши
                const dxMouse = mouseX - node.x;
                const dyMouse = mouseY - node.y;
                const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);
                if (distMouse < 180) {
                    node.x += dxMouse * 0.015;
                    node.y += dyMouse * 0.015;
                }

                nCtx.fillStyle = 'rgba(200, 215, 235, 0.7)';
                nCtx.beginPath();
                nCtx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
                nCtx.fill();

                // Соединительные линии между близкими узлами
                for (let j = i + 1; j < nodes.length; j++) {
                    const other = nodes[j];
                    const dx = other.x - node.x;
                    const dy = other.y - node.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        nCtx.strokeStyle = `rgba(180, 195, 220, ${1 - dist / 130})`;
                        nCtx.lineWidth = 0.6;
                        nCtx.beginPath();
                        nCtx.moveTo(node.x, node.y);
                        nCtx.lineTo(other.x, other.y);
                        nCtx.stroke();
                    }
                }
            });

            requestAnimationFrame(drawNodes);
        }
        drawNodes();

        // --- ВИЗУАЛИЗАТОР ЗВУКА И РЕАКЦИЯ ИНТЕРФЕЙСА ---
        const vizContainer = document.getElementById('visualizer');
        const barCount = 38;
        const bars = [];
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '4px';
            vizContainer.appendChild(bar);
            bars.push(bar);
        }

        let audioBassImpact = 0;

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < barCount; i++) {
                const val = dataArray[i] || 0;
                sum += val;
                const h = Math.max(4, (val / 255) * 58);
                bars[i].style.height = h + 'px';
            }
            audioBassImpact = sum / barCount;

            const glowStrength = Math.min(35, audioBassImpact / 3);
            uiPanel.style.boxShadow = `0 0 ${80 + glowStrength * 2}px rgba(0, 0, 0, 0.98), 0 0 ${glowStrength}px rgba(240, 245, 255, 0.3)`;
        }

        // --- ЭФФЕКТ СКАЧКА НАПРЯЖЕНИЯ / ГЛИТЧА ---
        setInterval(() => {
            if (Math.random() > 0.5) {
                const gBar = document.getElementById('glitch-bar');
                gBar.style.top = Math.random() * 100 + '%';
                gBar.style.height = Math.random() * 8 + 2 + 'px';
                gBar.style.opacity = '1';
                setTimeout(() => gBar.style.opacity = '0', 100);

                addTerminalLog("ОБНОВЛЕНИЕ СЕТИ: Пакет узлов синхронизирован.");
            }
        }, 5000);

        // --- ЛОГИ ТЕРМИНАЛА ---
        const terminal = document.getElementById('terminal');
        function addTerminalLog(text) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerText = text;
            terminal.appendChild(line);
            if (terminal.childNodes.length > 4) {
                terminal.removeChild(terminal.firstChild);
            }
        }

        // --- API GARRY'S MOD И ПРИНУДИТЕЛЬНЫЙ СТАРТ ---
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid) {
            forceStartAudio();
            addTerminalLog("Карта сервера: " + mapname);
            if (steamid) document.getElementById('username').innerText = steamid;
        }

        function SetFilesNeeded(needed) { window.totalFiles = needed; }

        function SetFilesRemaining(remaining) {
            forceStartAudio();
            if (window.totalFiles && window.totalFiles > 0) {
                let progress = Math.round(((window.totalFiles - remaining) / window.totalFiles) * 100);
                document.getElementById('bar').style.width = progress + '%';
                document.getElementById('percent').innerText = progress + '%';
                addTerminalLog("Загрузка файлов: осталось " + remaining + "...");
            }
        }

        function SetStatusChanged(status) {
            forceStartAudio();
            document.getElementById('status').innerText = status.toUpperCase();
            addTerminalLog("Статус: " + status);
        }
    </script>
</body>
</html>
