<!DOCTYPE html>
<html lang="ru">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Paranoiasim Loading Screen</title>
	<style>
		@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700&display=swap');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			user-select: none;
		}

		body {
			width: 100%;
			height: 100vh;
			overflow: hidden;
			background-color: #0a0a0a;
			font-family: 'Disket Mono', 'JetBrains Mono', monospace;
			color: #fff;
		}

		canvas#grid {
			position: absolute;
			top: 0;
			left: 0;
		}

		.gradient {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: radial-gradient(ellipse at center, rgba(230, 0, 0, 0) 0%, rgba(61, 61, 61, 0.5) 100%);
			pointer-events: none;
		}

		.audio-controls {
			position: fixed;
			top: 25px;
			right: 25px;
			font-size: 11px;
			letter-spacing: 2px;
			color: #f3f4f6;
			background: rgba(0, 0, 0, 0.75);
			border: 1px solid #374151;
			padding: 8px 14px;
			border-radius: 4px;
			cursor: pointer;
			z-index: 99999;
			backdrop-filter: blur(5px);
			transition: all 0.3s ease;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
		}

		.audio-controls:hover {
			border-color: #fff;
			box-shadow: 0 0 15px rgba(209, 213, 219, 0.25);
			color: #fff;
			transform: scale(1.05);
		}

		.centertext {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			text-align: center;
			z-index: 10;
			width: 100%;
			max-width: 800px;
		}

		.logo-img {
			max-width: 500px;
			width: 90%;
			height: auto;
			display: block;
			margin: 0 auto;
			animation: beat 0.5s infinite alternate ease-in-out;
		}

		@keyframes beat {
			0% {
				transform: scale(1);
				filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2));
			}
			100% {
				transform: scale(1.04);
				filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
			}
		}

		.info {
			font-size: 1rem;
			letter-spacing: 1px;
			opacity: 0.8;
			font-family: 'Disket Mono', 'JetBrains Mono', monospace;
		}

		#text_tips {
			transition: opacity 0.5s ease;
			display: block;
			margin-top: 1rem;
			font-size: 0.9rem;
		}

		.info-down {
			position: absolute;
			bottom: 20px;
			right: 20px;
			font-size: 0.9rem;
			opacity: 0.6;
			font-family: 'Disket Mono', 'JetBrains Mono', monospace;
		}

		.info-down a {
			color: inherit;
			text-decoration: none;
		}
	</style>
</head>
<body>
	<canvas id="grid"></canvas>
    <div class="gradient"></div>

    <div class="audio-controls" id="mute-btn" onclick="toggleMusic()">
        [ SOUND: ON ]
    </div>
	
	<div class="centertext">
		<img src="logoist.png" alt="Logo" class="logo-img">
        <div style="margin-top: 15px;">
            <span class="info" id="info" style="font-weight: 500;">by Викентий & Adidas</span>
            <br>
            <span class="info" id="map"></span>
            <br>
            <span id="text_tips" tip="" style="opacity: 1;">TIPS: LOADING...</span>
        </div>
	</div>
	
    <span class="info-down">paranoiaism // <a href="https://discord.gg/mBvYUttjN" target="_blank">discord.gg/mBvYUttjN</a></span>

    <!-- Элемент аудио -->
    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <script>
        const canvas = document.getElementById('grid');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        
        const gridSize = 60;
        let offsetX = window.innerWidth;
        let offsetY = -window.innerHeight;
        const gridColor = 'rgba(99, 88, 104, 0.05)';
        
        function drawGrid() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let x = offsetX % gridSize; x < canvas.width + gridSize; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            for (let y = offsetY % gridSize; y < canvas.height + gridSize; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.strokeStyle = gridColor;
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            offsetX -= Math.min(Math.max(Math.sin(Date.now() / 10000), -0.2), 0.2);
            offsetY += 0.2;

            requestAnimationFrame(drawGrid);
        }

        drawGrid();

        window.addEventListener('resize', resizeCanvas);
    </script>

    <script>
        // --- АУДИО МЕНЕДЖЕР С АВТОЗАПУСКОМ (Как в index_2.html) ---
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');
        music.volume = 0.25;

        let audioCtx;
        let isMuted = false;

        function startAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            music.play().then(() => {
                muteBtn.innerText = "[ SOUND: ON ]";
            }).catch(() => {
                // Если браузер заблокировал автоплей, подхватится при первом взаимодействии
            });
        }

        function toggleMusic() {
            startAudio();
            if (music.paused) {
                music.play();
                isMuted = false;
                muteBtn.innerText = "[ SOUND: ON ]";
            } else {
                music.pause();
                isMuted = true;
                muteBtn.innerText = "[ SOUND: MUTED ]";
            }
        }

        // Автозапуск музыки при загрузке и любых действиях
        window.addEventListener('load', () => {
            startAudio();
            document.addEventListener('mousemove', startAudio, { once: true });
            document.addEventListener('keydown', startAudio, { once: true });
            document.addEventListener('click', startAudio, { once: true });
        });

        // Подсказки
        const tips = {
            ru: [
                "Если человек ведет себя подозрительно, это не совсем причина для убийства",
                "ZCITY PLAYER старался быть добрым...",
                "Поверь, лучше не говори: ляг на пол.",
                "Напиши !skip если хочешь доказать что ты нуб",
                "Изначальная идея нашего сервера, быть заменой оригинальному Z-CITY",
                "В меню ты можешь полностью настроить loadout трейтора",
                "А ВЫ ПОМНИТЕ HOMIFORK+?",
                "Milky хуесос и не может написать хотя-бы строки кода на своём OTSO-CITY",
                "Тут если что есть правила, и да, они были и на оригинале",
                "Викентий сделал самую большую часть сервера"
            ],
            en: [
                "If someone acts suspiciously, that's not quite a reason to kill",
                "ZCITY PLAYER tried to be kind...",
                "Believe me, it's better not to say: lie down on the floor. (ляг на пол)",
                "Write !skip if you want to prove that you're a noob.",
                "The original idea of ​​our server was to be a replacement for the original Z-CITY",
                "DO YOU REMEMBER HOMIFORK+?",
                "Milky is a dicksucker and can't write even a line of code on his OTSO-CITY",
                "There are rules here, and yes, they were in the original too.",
                "Vikentiy made the largest portion of the server"
            ]
        };

        var currentLang = navigator.language;

        function SelectTip() {
            const newLang = (currentLang === 'ru-RU' || currentLang === 'ru') ? 'ru' : 'en';
            const tipsList = tips[newLang];
            const randomIndex = Math.floor(Math.random() * tipsList.length);

            document.querySelectorAll('[tip]').forEach(element => {
                element.textContent = tipsList[randomIndex];
            });
        }

        const changingText = document.getElementById('text_tips');
        function changeText(){
            changingText.style.opacity = 0;
            changingText.addEventListener('transitionend', handleTransitionEnd, { once: true });
            function handleTransitionEnd(){
                changingText.style.opacity = 1;
                SelectTip();
                startThink();
            }
        }

        function startThink(){
            setTimeout(() => {
                changeText();
            }, 12000);
        }
        setTimeout(() => {changeText();}, 500);

        const infoText = document.getElementById('info');
        const mapText = document.getElementById('map');
        
        function GameDetails( servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language ) {
            startAudio();
            if (servername) {
                const parts = servername.split("|");
                if (parts[2]) infoText.textContent = parts[2].trim();
            }
            if (mapname) {
                mapText.textContent = "On map: " + mapname;
            }
            if (language) {
                currentLang = language;
            }
            if (volume !== undefined && music) {
                music.volume = volume * 0.25;
            }
        }

        function SetStatusChanged(status) {
            startAudio();
        }
    </script>
</body>
</html>
