<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>kill them all....</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(16, 18, 22, 0.94);
            --accent-gray: #9ca3af;
            --light-gray: #f3f4f6;
            --dark-gray: #111827;
            --border-gray: #374151;
            --glow-gray: rgba(209, 213, 219, 0.25);
            --glitch-red: rgba(255, 0, 50, 0.75);
            --glitch-blue: rgba(0, 200, 255, 0.75);
        }

        body {
            height: 100vh;
            background: var(--bg-color);
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--light-gray);
        }

        /* КНОПКА ЗВУКА В ВЕРХНЕМ ПРАВОМ УГЛУ (Чтобы gmod не перекрывал) */
        .audio-controls {
            position: fixed;
            top: 25px;
            right: 25px;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--light-gray);
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--border-gray);
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 99999;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }

        .audio-controls:hover {
            border-color: #fff;
            box-shadow: 0 0 15px var(--glow-gray);
            color: #fff;
            transform: scale(1.05);
        }

        /* Эффект CRT монитора и сканирующих линий */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 20, 24, 0) 50%, rgba(0, 0, 0, 0.65) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
            animation: scanlineFlicker 0.15s infinite alternate;
        }

        @keyframes scanlineFlicker {
            0% { opacity: 0.95; }
            100% { opacity: 1; }
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 180px rgba(0, 0, 0, 0.95);
            z-index: 9;
            pointer-events: none;
        }

        #canvas, #blood-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        #canvas { z-index: 1; }
        #blood-canvas { z-index: 7; pointer-events: none; }

        /* Главный интерфейс */
        .interface {
            position: relative;
            z-index: 8;
            width: 88%;
            max-width: 980px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-gray);
            padding: 40px;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.95), inset 0 0 30px rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            animation: interfaceEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes interfaceEntrance {
            0% { opacity: 0; transform: scale(0.92) translateY(20px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* Угловые рамки с неоновой пульсацией */
        .interface::before, .interface::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid var(--accent-gray);
            animation: borderPulse 3s infinite alternate;
        }
        .interface::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .interface::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

        @keyframes borderPulse {
            0% { border-color: var(--border-gray); box-shadow: 0 0 0px transparent; }
            100% { border-color: var(--light-gray); box-shadow: 0 0 12px var(--glow-gray); }
        }

        .shake {
            animation: screenShake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-3px, 2px, 0); }
            20%, 80% { transform: translate3d(5px, -3px, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 4px, 0); }
            40%, 60% { transform: translate3d(6px, -4px, 0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gray);
            padding-bottom: 18px;
            margin-bottom: 25px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 3px;
            border: 1px solid var(--accent-gray);
            background: var(--dark-gray);
            filter: grayscale(80%);
            transition: transform 0.3s ease;
        }

        .avatar:hover {
            transform: scale(1.08);
            filter: grayscale(0%);
        }

        .user-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #6b7280;
        }

        .username {
            color: var(--light-gray);
            font-weight: bold;
            font-size: 15px;
            text-shadow: 0 0 8px var(--glow-gray);
        }

        .system-stats {
            font-size: 10px;
            color: #6b7280;
            text-align: right;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .system-stats span {
            color: var(--accent-gray);
        }

        .title-box {
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }

        /* КРУТОЙ ГЛИТЧ ЗАГОЛОВОК */
        .glitch-title {
            font-size: 72px;
            font-weight: 900;
            letter-spacing: 14px;
            text-transform: uppercase;
            color: #ffffff;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            animation: glitchText 3s infinite;
        }

        .glitch-title::before, .glitch-title::after {
            content: "Paranoiasim";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch-title::before {
            left: -2px;
            text-shadow: 2px 0 var(--glitch-red);
            animation: glitchAnim1 2s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: 2px;
            text-shadow: -2px 0 var(--glitch-blue);
            animation: glitchAnim2 1.5s infinite linear alternate-reverse;
        }

        @keyframes glitchAnim1 {
            0% { clip: rect(20px, 9999px, 40px, 0); }
            20% { clip: rect(60px, 9999px, 80px, 0); }
            40% { clip: rect(10px, 9999px, 30px, 0); }
            60% { clip: rect(50px, 9999px, 70px, 0); }
            80% { clip: rect(30px, 9999px, 50px, 0); }
            100% { clip: rect(0px, 9999px, 20px, 0); }
        }

        @keyframes glitchAnim2 {
            0% { clip: rect(50px, 9999px, 70px, 0); }
            20% { clip: rect(10px, 9999px, 30px, 0); }
            40% { clip: rect(60px, 9999px, 80px, 0); }
            60% { clip: rect(20px, 9999px, 40px, 0); }
            80% { clip: rect(40px, 9999px, 60px, 0); }
            100% { clip: rect(30px, 9999px, 50px, 0); }
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 8px;
            color: var(--accent-gray);
            text-transform: uppercase;
            margin-top: 6px;
            opacity: 0.8;
        }

        /* Визуализатор аудио */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            height: 45px;
            margin-bottom: 25px;
        }

        .bar {
            width: 6px;
            background: linear-gradient(180deg, #ffffff, var(--accent-gray));
            box-shadow: 0 0 8px var(--glow-gray);
            border-radius: 1px;
            transition: height 0.04s ease;
        }

        /* Консольный терминал логов */
        .terminal {
            background: rgba(8, 9, 12, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            height: 85px;
            overflow: hidden;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-radius: 2px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .terminal-line {
            margin-top: 4px;
            white-space: nowrap;
            animation: lineFade 0.3s ease-out forwards;
        }

        @keyframes lineFade {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .terminal-line::before {
            content: "> ";
            color: #e5e7eb;
            font-weight: bold;
        }

        /* Прогресс-бар */
        .progress-container {
            margin-bottom: 18px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .progress-box {
            width: 100%;
            background: #090a0d;
            border: 1px solid var(--border-gray);
            padding: 4px;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 10px;
            width: 0%;
            background: linear-gradient(90deg, #374151, #9ca3af, #ffffff);
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 15px var(--glow-gray);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; width: 10px;
            background: #fff;
            box-shadow: 0 0 10px #fff;
        }

        .track-info {
            text-align: center;
            font-size: 10px;
            color: #6b7280;
            letter-spacing: 2px;
        }

        .track-info span {
            color: var(--light-gray);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>
    <audio id="gunshot" src="shot.mp3" preload="auto"></audio>

    <div class="audio-controls" id="mute-btn" onclick="toggleMusic()">
        [ SOUND: ON ]
    </div>

    <div class="scanlines"></div>
    <div class="vignette"></div>
    <canvas id="canvas"></canvas>
    <canvas id="blood-canvas"></canvas>

    <div class="interface" id="main-ui">
        <div class="header">
            <div class="user-info">
                <img id="avatar" class="avatar" src="https://i.imgur.com/839598X.png" alt="Steam Avatar">
                <div class="user-text">
                    ПОЛЬЗОВАТЕЛЬ<br>
                    <span id="username" class="username">GOREMAN</span>
                </div>
            </div>
            <div class="system-stats">
                СИСТЕМА: <span>HOMICIDE / WIRED</span><br>
                ПИНГ: <span id="ping">24 ms</span> | FPS: <span id="fps">60</span>
            </div>
        </div>

        <div class="title-box">
            <div class="glitch-title">XIROCITY</div>
            <div class="subtitle">INTO THE WIRED // GRAY EDITION</div>
        </div>

        <div class="visualizer" id="visualizer"></div>

        <div class="terminal" id="terminal">
            <div class="terminal-line">Инициализация системного ядра...</div>
            <div class="terminal-line">Подключение к сети WIRED установлено.</div>
        </div>

        <div class="progress-container">
            <div class="progress-header">
                <span id="status">ЗАГРУЗКА РЕСУРСОВ...</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-box">
                <div class="progress-bar" id="bar"></div>
            </div>
        </div>

        <div class="track-info">
            ТРЕК: <span>emotionalpastel - ode 2 1em0xx (into the wired)</span>
        </div>
    </div>

    <script>
        // --- АУДИО МЕНЕДЖЕР С АВТОЗАПУСКОМ ---
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');
        music.volume = 0.45;

        let audioCtx, analyser, dataArray;
        let isMuted = false;

        function startAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(music);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                renderVisualizer();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            music.play().then(() => {
                muteBtn.innerText = "[ SOUND: ON ]";
            }).catch(() => {
                // Если браузер заблокировал автоплей, подхватится при первом взаимодействии
            });
        }

        function toggleMusic() {
            startAudio();
            if (music.paused) {
                music.play();
                isMuted = false;
                muteBtn.innerText = "[ SOUND: ON ]";
            } else {
                music.pause();
                isMuted = true;
                muteBtn.innerText = "[ SOUND: MUTED ]";
            }
        }

        // Автозапуск музыки при загрузке и любых действиях
        window.addEventListener('load', () => {
            startAudio();
            document.addEventListener('mousemove', startAudio, { once: true });
            document.addEventListener('keydown', startAudio, { once: true });
            document.addEventListener('click', startAudio, { once: true });
        });

        // --- ВИЗУАЛИЗАТОР ЗВУКА ---
        const vizContainer = document.getElementById('visualizer');
        const barCount = 32;
        const bars = [];
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '4px';
            vizContainer.appendChild(bar);
            bars.push(bar);
        }

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);

            for (let i = 0; i < barCount; i++) {
                const val = dataArray[i] || 0;
                const h = Math.max(4, (val / 255) * 42);
                bars[i].style.height = h + 'px';
            }
        }

        // --- ФОНОВЫЕ СЕРЫЕ ЧАСТИЦЫ ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for (let i = 0; i < 90; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speedY: Math.random() * 0.5 + 0.1,
                speedX: Math.random() * 0.4 - 0.2,
                opacity: Math.random() * 0.5 + 0.1
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.fillStyle = `rgba(180, 190, 205, ${p.opacity})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();

                p.y += p.speedY;
                p.x += p.speedX;

                if (p.y > canvas.height) p.y = 0;
                if (p.x > canvas.width) p.x = 0;
                if (p.x < 0) p.x = canvas.width;
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // --- ЭФФЕКТ СТЕКАЮЩЕЙ КРОВИ ---
        const bloodCanvas = document.getElementById('blood-canvas');
        const bCtx = bloodCanvas.getContext('2d');
        bloodCanvas.width = window.innerWidth;
        bloodCanvas.height = window.innerHeight;

        let bloodDrips = [];

        function triggerBloodSplatter() {
            const gunshot = document.getElementById('gunshot');
            gunshot.currentTime = 0;
            gunshot.volume = 0.4;
            gunshot.play().catch(() => {});

            const ui = document.getElementById('main-ui');
            ui.classList.add('shake');
            setTimeout(() => ui.classList.remove('shake'), 250);

            let centerX = Math.random() * (bloodCanvas.width * 0.8) + (bloodCanvas.width * 0.1);
            let centerY = Math.random() * (bloodCanvas.height * 0.4) + (bloodCanvas.height * 0.1);

            for (let i = 0; i < 5; i++) {
                let offX = (Math.random() - 0.5) * 35;
                let offY = (Math.random() - 0.5) * 35;
                let rad = Math.random() * 22 + 8;

                let grad = bCtx.createRadialGradient(centerX + offX, centerY + offY, 1, centerX + offX, centerY + offY, rad);
                grad.addColorStop(0, 'rgba(40, 0, 5, 0.95)');
                grad.addColorStop(1, 'rgba(10, 0, 0, 0)');

                bCtx.fillStyle = grad;
                bCtx.beginPath();
                bCtx.arc(centerX + offX, centerY + offY, rad, 0, Math.PI * 2);
                bCtx.fill();
            }

            let dripCount = Math.floor(Math.random() * 3) + 2;
            for (let i = 0; i < dripCount; i++) {
                bloodDrips.push({
                    x: centerX + (Math.random() - 0.5) * 35,
                    y: centerY,
                    maxLength: Math.random() * 260 + 90,
                    currentLength: 0,
                    speed: Math.random() * 1.8 + 0.6,
                    width: Math.random() * 3 + 1.2,
                    opacity: 0.95
                });
            }
            
            addTerminalLog("КРИТИЧЕСКОЕ СОБЫТИЕ: Потеря пакетов данных на узле.");
        }

        function drawBloodDrips() {
            bloodDrips.forEach((d, index) => {
                if (d.currentLength < d.maxLength) {
                    d.currentLength += d.speed;
                    bCtx.fillStyle = `rgba(35, 0, 5, ${d.opacity})`;
                    bCtx.beginPath();
                    bCtx.arc(d.x, d.y + d.currentLength, d.width, 0, Math.PI * 2);
                    bCtx.fill();
                } else {
                    d.opacity -= 0.0015;
                }
                if (d.opacity <= 0) bloodDrips.splice(index, 1);
            });
            requestAnimationFrame(drawBloodDrips);
        }
        drawBloodDrips();

        setInterval(() => {
            if(Math.random() > 0.45) triggerBloodSplatter();
        }, 6500);

        // --- ЛОГИ ТЕРМИНАЛА ---
        const terminal = document.getElementById('terminal');
        function addTerminalLog(text) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerText = text;
            terminal.appendChild(line);
            if (terminal.childNodes.length > 4) {
                terminal.removeChild(terminal.firstChild);
            }
        }

        // --- API GARRY'S MOD ---
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid) {
            startAudio();
            addTerminalLog("Карта сервера: " + mapname);
            if (steamid) document.getElementById('username').innerText = steamid;
        }

        function SetFilesNeeded(needed) { window.totalFiles = needed; }

        function SetFilesRemaining(remaining) {
            if (window.totalFiles && window.totalFiles > 0) {
                let progress = Math.round(((window.totalFiles - remaining) / window.totalFiles) * 100);
                document.getElementById('bar').style.width = progress + '%';
                document.getElementById('percent').innerText = progress + '%';
                addTerminalLog("Загрузка файлов: " + remaining + " осталось...");
            }
        }

        function SetStatusChanged(status) {
            startAudio();
            document.getElementById('status').innerText = status.toUpperCase();
            addTerminalLog("Статус: " + status);
        }
    </script>
</body>
</html>
