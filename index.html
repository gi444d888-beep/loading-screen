<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PARANOIASIM // INTO THE WIRED</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #060709;
            --panel-bg: rgba(12, 14, 18, 0.95);
            --accent-gray: #a1a8b8;
            --light-gray: #f3f4f6;
            --dark-gray: #0d1117;
            --border-gray: #2d333f;
            --glow-gray: rgba(220, 225, 235, 0.4);
            --glitch-red: rgba(255, 0, 50, 0.9);
            --glitch-blue: rgba(0, 210, 255, 0.9);
        }

        body {
            height: 100vh;
            background: var(--bg-color);
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--light-gray);
        }

        /* КНОПКА ЗВУКА В ЛЕВОМ ВЕРХНЕМ УГЛУ (ТАМ GMOD ТОЧНО НЕ ЗАКРЫВАЕТ) */
        .audio-controls {
            position: fixed !important;
            top: 20px !important;
            left: 20px !important;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
            background: rgba(5, 6, 8, 0.9);
            border: 2px solid var(--accent-gray);
            padding: 12px 20px;
            border-radius: 2px;
            cursor: pointer;
            z-index: 9999999 !important;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.95), 0 0 10px var(--glow-gray);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .audio-controls:hover {
            border-color: #ffffff;
            background: rgba(25, 28, 35, 0.98);
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
        }

        /* Эффект CRT монитора и мерцание */
        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 20, 24, 0) 50%, rgba(0, 0, 0, 0.8) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.05));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
            animation: scanlineFlicker 0.08s infinite alternate;
        }

        @keyframes scanlineFlicker {
            0% { opacity: 0.88; }
            100% { opacity: 1; }
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 220px rgba(0, 0, 0, 0.98);
            z-index: 9;
            pointer-events: none;
        }

        #canvas, #blood-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        #canvas { z-index: 1; }
        #blood-canvas { z-index: 7; pointer-events: none; }

        /* Главный интерфейс */
        .interface {
            position: relative;
            z-index: 8;
            width: 90%;
            max-width: 1020px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gray);
            padding: 45px;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.98), inset 0 0 40px rgba(255, 255, 255, 0.02);
            border-radius: 3px;
            animation: interfaceEntrance 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes interfaceEntrance {
            0% { opacity: 0; transform: scale(0.88) translateY(40px); filter: blur(15px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        /* Анимированные углы интерфейса */
        .interface::before, .interface::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            border: 2px solid var(--accent-gray);
            animation: borderPulse 1.8s infinite alternate ease-in-out;
        }
        .interface::before { top: -3px; left: -3px; border-right: 0; border-bottom: 0; }
        .interface::after { bottom: -3px; right: -3px; border-left: 0; border-top: 0; }

        @keyframes borderPulse {
            0% { border-color: var(--border-gray); box-shadow: 0 0 0px transparent; }
            100% { border-color: #ffffff; box-shadow: 0 0 20px var(--glow-gray); }
        }

        .shake {
            animation: screenShake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes screenShake {
            10%, 90% { transform: translate3d(-5px, 3px, 0); }
            20%, 80% { transform: translate3d(7px, -5px, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 6px, 0); }
            40%, 60% { transform: translate3d(8px, -6px, 0); }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gray);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 3px;
            border: 1px solid var(--accent-gray);
            background: var(--dark-gray);
            filter: grayscale(85%);
            transition: all 0.3s ease;
        }

        .avatar:hover {
            filter: grayscale(0%);
            transform: scale(1.05);
            box-shadow: 0 0 15px var(--glow-gray);
        }

        .user-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #6b7280;
        }

        .username {
            color: var(--light-gray);
            font-weight: bold;
            font-size: 16px;
            text-shadow: 0 0 10px var(--glow-gray);
        }

        .system-stats {
            font-size: 10px;
            color: #6b7280;
            text-align: right;
            letter-spacing: 1px;
            line-height: 1.6;
        }

        .system-stats span {
            color: var(--accent-gray);
            font-weight: bold;
        }

        .title-box {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        /* 💥 СВЕРХКРУТОЙ 3D ГЛИТЧ ЗАГОЛОВОК PARANOIASIM 💥 */
        .glitch-title {
            font-size: 68px;
            font-weight: 900;
            letter-spacing: 16px;
            text-transform: uppercase;
            color: #ffffff;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
            animation: glitchMain 4s infinite;
        }

        .glitch-title::before, .glitch-title::after {
            content: "PARANOIASIM";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip: rect(0, 0, 0, 0);
        }

        .glitch-title::before {
            left: -3px;
            text-shadow: 3px 0 var(--glitch-red);
            animation: glitchAnim1 0.8s infinite linear alternate-reverse;
        }

        .glitch-title::after {
            left: 3px;
            text-shadow: -3px 0 var(--glitch-blue);
            animation: glitchAnim2 1.1s infinite linear alternate-reverse;
        }

        @keyframes glitchAnim1 {
            0% { clip: rect(15px, 9999px, 35px, 0); transform: skew(0.3deg); }
            20% { clip: rect(55px, 9999px, 75px, 0); transform: skew(-0.5deg); }
            40% { clip: rect(5px, 9999px, 25px, 0); transform: skew(0.8deg); }
            60% { clip: rect(45px, 9999px, 65px, 0); transform: skew(-0.2deg); }
            80% { clip: rect(25px, 9999px, 45px, 0); transform: skew(0.4deg); }
            100% { clip: rect(0px, 9999px, 15px, 0); transform: skew(-0.6deg); }
        }

        @keyframes glitchAnim2 {
            0% { clip: rect(45px, 9999px, 65px, 0); transform: skew(-0.4deg); }
            20% { clip: rect(15px, 9999px, 35px, 0); transform: skew(0.6deg); }
            40% { clip: rect(65px, 9999px, 85px, 0); transform: skew(-0.2deg); }
            60% { clip: rect(25px, 9999px, 45px, 0); transform: skew(0.5deg); }
            80% { clip: rect(35px, 9999px, 55px, 0); transform: skew(-0.7deg); }
            100% { clip: rect(20px, 9999px, 40px, 0); transform: skew(0.3deg); }
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 10px;
            color: var(--accent-gray);
            text-transform: uppercase;
            margin-top: 8px;
            opacity: 0.85;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        /* Визуализатор звука */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 6px;
            height: 50px;
            margin-bottom: 25px;
        }

        .bar {
            width: 6px;
            background: linear-gradient(180deg, #ffffff, var(--accent-gray), #1a1e24);
            box-shadow: 0 0 12px var(--glow-gray);
            border-radius: 1px;
            transition: height 0.03s cubic-bezier(0, 0, 0.2, 1);
        }

        /* Терминал логов */
        .terminal {
            background: rgba(6, 7, 9, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            height: 90px;
            overflow: hidden;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            border-radius: 2px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
        }

        .terminal-line {
            margin-top: 4px;
            white-space: nowrap;
            animation: lineFade 0.2s ease-out forwards;
        }

        @keyframes lineFade {
            from { opacity: 0; transform: translateX(-8px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .terminal-line::before {
            content: "[LOG] > ";
            color: #ffffff;
            font-weight: bold;
        }

        /* Прогресс-бар */
        .progress-container {
            margin-bottom: 20px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .progress-box {
            width: 100%;
            background: #08090c;
            border: 1px solid var(--border-gray);
            padding: 4px;
            border-radius: 2px;
            position: relative;
        }

        .progress-bar {
            height: 12px;
            width: 0%;
            background: linear-gradient(90deg, #2d333f, #9ca3af, #ffffff);
            transition: width 0.2s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 0 20px var(--glow-gray);
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; width: 8px;
            background: #fff;
            box-shadow: 0 0 12px #fff;
        }

        .track-info {
            text-align: center;
            font-size: 10px;
            color: #6b7280;
            letter-spacing: 2px;
        }

        .track-info span {
            color: var(--light-gray);
            font-weight: bold;
        }
    </style>
</head>
<body onclick="forceStartAudio()" onmousemove="forceStartAudio()" onkeydown="forceStartAudio()">

    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>
    <audio id="gunshot" src="shot.mp3" preload="auto"></audio>

    <!-- КНОПКА МУТА В ВЕРХНЕМ ЛЕВОМ УГЛУ -->
    <button class="audio-controls" id="mute-btn" onclick="toggleMusic(event)">
        🔊 [ МУЗЫКА: ВКЛ ]
    </button>

    <div class="scanlines"></div>
    <div class="vignette"></div>
    <canvas id="canvas"></canvas>
    <canvas id="blood-canvas"></canvas>

    <div class="interface" id="main-ui">
        <div class="header">
            <div class="user-info">
                <img id="avatar" class="avatar" src="https://i.imgur.com/839598X.png" alt="Steam Avatar">
                <div class="user-text">
                    ПОЛЬЗОВАТЕЛЬ<br>
                    <span id="username" class="username">GOREMAN</span>
                </div>
            </div>
            <div class="system-stats">
                СИСТЕМА: <span>PARANOIASIM / WIRED</span><br>
                ПИНГ: <span id="ping">18 ms</span> | FPS: <span id="fps">60</span>
            </div>
        </div>

        <div class="title-box">
            <div class="glitch-title">PARANOIASIM</div>
            <div class="subtitle">INTO THE WIRED // GRAY EDITION</div>
        </div>

        <div class="visualizer" id="visualizer"></div>

        <div class="terminal" id="terminal">
            <div class="terminal-line">Инициализация Paranoiasim Engine...</div>
            <div class="terminal-line">Подключение к прослойке WIRED прошло успешно.</div>
        </div>

        <div class="progress-container">
            <div class="progress-header">
                <span id="status">ЗАГРУЗКА РЕСУРСОВ...</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-box">
                <div class="progress-bar" id="bar"></div>
            </div>
        </div>

        <div class="track-info">
            ТРЕК: <span>emotionalpastel - ode 2 1em0xx (into the wired)</span>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');
        music.volume = 0.55;

        let audioCtx, analyser, dataArray;
        let started = false;

        function forceStartAudio() {
            if (started) return;
            
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(music);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                renderVisualizer();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            music.play().then(() => {
                started = true;
                muteBtn.innerText = "🔊 [ МУЗЫКА: ВКЛ ]";
            }).catch(() => {});
        }

        function toggleMusic(e) {
            if (e) e.stopPropagation();
            forceStartAudio();
            if (music.paused) {
                music.play();
                muteBtn.innerText = "🔊 [ МУЗЫКА: ВКЛ ]";
            } else {
                music.pause();
                muteBtn.innerText = "🔇 [ МУЗЫКА: ВЫКЛ ]";
            }
        }

        // --- ВИЗУАЛИЗАТОР ЗВУКА ---
        const vizContainer = document.getElementById('visualizer');
        const barCount = 36;
        const bars = [];
        for (let i = 0; i < barCount; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            bar.style.height = '4px';
            vizContainer.appendChild(bar);
            bars.push(bar);
        }

        let audioBassImpact = 0;

        function renderVisualizer() {
            requestAnimationFrame(renderVisualizer);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);

            let sum = 0;
            for (let i = 0; i < barCount; i++) {
                const val = dataArray[i] || 0;
                sum += val;
                const h = Math.max(4, (val / 255) * 50);
                bars[i].style.height = h + 'px';
            }
            audioBassImpact = sum / barCount; // Использование для эффекта реактивных частиц
        }

        // --- ДИНАМИЧЕСКИЕ ЧАСТИЦЫ, РЕАГИРУЮЩИЕ НА БАС ---
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speedY: Math.random() * 0.6 + 0.1,
                speedX: Math.random() * 0.4 - 0.2,
                opacity: Math.random() * 0.6 + 0.1
            });
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let boost = audioBassImpact ? (audioBassImpact / 255) * 2 : 0;

            particles.forEach(p => {
                ctx.fillStyle = `rgba(190, 200, 215, ${Math.min(1, p.opacity + boost)})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size + boost, 0, Math.PI * 2);
                ctx.fill();

                p.y += p.speedY + boost * 2;
                p.x += p.speedX;

                if (p.y > canvas.height) p.y = 0;
                if (p.x > canvas.width) p.x = 0;
                if (p.x < 0) p.x = canvas.width;
            });
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        // --- ЭФФЕКТ СТЕКАЮЩЕЙ КРОВИ ---
        const bloodCanvas = document.getElementById('blood-canvas');
        const bCtx = bloodCanvas.getContext('2d');
        bloodCanvas.width = window.innerWidth;
        bloodCanvas.height = window.innerHeight;

        let bloodDrips = [];

        function triggerBloodSplatter() {
            const gunshot = document.getElementById('gunshot');
            gunshot.currentTime = 0;
            gunshot.volume = 0.45;
            gunshot.play().catch(() => {});

            const ui = document.getElementById('main-ui');
            ui.classList.add('shake');
            setTimeout(() => ui.classList.remove('shake'), 250);

            let centerX = Math.random() * (bloodCanvas.width * 0.8) + (bloodCanvas.width * 0.1);
            let centerY = Math.random() * (bloodCanvas.height * 0.4) + (bloodCanvas.height * 0.1);

            for (let i = 0; i < 6; i++) {
                let offX = (Math.random() - 0.5) * 40;
                let offY = (Math.random() - 0.5) * 40;
                let rad = Math.random() * 25 + 10;

                let grad = bCtx.createRadialGradient(centerX + offX, centerY + offY, 1, centerX + offX, centerY + offY, rad);
                grad.addColorStop(0, 'rgba(45, 0, 5, 0.98)');
                grad.addColorStop(1, 'rgba(10, 0, 0, 0)');

                bCtx.fillStyle = grad;
                bCtx.beginPath();
                bCtx.arc(centerX + offX, centerY + offY, rad, 0, Math.PI * 2);
                bCtx.fill();
            }

            let dripCount = Math.floor(Math.random() * 4) + 2;
            for (let i = 0; i < dripCount; i++) {
                bloodDrips.push({
                    x: centerX + (Math.random() - 0.5) * 40,
                    y: centerY,
                    maxLength: Math.random() * 280 + 100,
                    currentLength: 0,
                    speed: Math.random() * 2.0 + 0.7,
                    width: Math.random() * 3.5 + 1.2,
                    opacity: 0.98
                });
            }
            
            addTerminalLog("ОШИБКА ЯДРА: Аномальный сбой сегментации Paranoiasim.");
        }

        function drawBloodDrips() {
            bloodDrips.forEach((d, index) => {
                if (d.currentLength < d.maxLength) {
                    d.currentLength += d.speed;
                    bCtx.fillStyle = `rgba(40, 0, 5, ${d.opacity})`;
                    bCtx.beginPath();
                    bCtx.arc(d.x, d.y + d.currentLength, d.width, 0, Math.PI * 2);
                    bCtx.fill();
                } else {
                    d.opacity -= 0.0015;
                }
                if (d.opacity <= 0) bloodDrips.splice(index, 1);
            });
            requestAnimationFrame(drawBloodDrips);
        }
        drawBloodDrips();

        setInterval(() => {
            if(Math.random() > 0.4) triggerBloodSplatter();
        }, 6000);

        // --- ЛОГИ ТЕРМИНАЛА ---
        const terminal = document.getElementById('terminal');
        function addTerminalLog(text) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerText = text;
            terminal.appendChild(line);
            if (terminal.childNodes.length > 4) {
                terminal.removeChild(terminal.firstChild);
            }
        }

        // --- API GARRY'S MOD И ПРИНУДИТЕЛЬНЫЙ СТАРТ ---
        function GameDetails(servername, serverurl, mapname, maxplayers, steamid) {
            forceStartAudio();
            addTerminalLog("Карта сервера: " + mapname);
            if (steamid) document.getElementById('username').innerText = steamid;
        }

        function SetFilesNeeded(needed) { window.totalFiles = needed; }

        function SetFilesRemaining(remaining) {
            forceStartAudio();
            if (window.totalFiles && window.totalFiles > 0) {
                let progress = Math.round(((window.totalFiles - remaining) / window.totalFiles) * 100);
                document.getElementById('bar').style.width = progress + '%';
                document.getElementById('percent').innerText = progress + '%';
                addTerminalLog("Загрузка файлов: осталось " + remaining + "...");
            }
        }

        function SetStatusChanged(status) {
            forceStartAudio();
            document.getElementById('status').innerText = status.toUpperCase();
            addTerminalLog("Статус: " + status);
        }
    </script>
</body>
</html>
