<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PARANOIASIM // Z-CITY LOADING SCREEN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #050608;
            --panel-bg: rgba(12, 14, 18, 0.95);
            --accent-gray: #b0b7c6;
            --border-gray: #282d37;
            --dark-gray: #090b0e;
            --light-gray: #e2e8f0;
            --glow-gray: rgba(220, 230, 245, 0.25);
            --danger-gray: #525a68;
        }

        body {
            height: 100vh;
            background: var(--bg-color);
            font-family: 'Consolas', 'Courier New', monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--light-gray);
            perspective: 1000px;
        }

        /* КНОПКА ЗВУКА */
        .audio-controls {
            position: fixed !important;
            top: 20px !important;
            left: 20px !important;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--light-gray);
            background: rgba(8, 10, 14, 0.92);
            border: 1px solid var(--accent-gray);
            padding: 10px 18px;
            border-radius: 2px;
            cursor: pointer;
            z-index: 9999999 !important;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.9);
            transition: all 0.2s ease;
        }

        .audio-controls:hover {
            border-color: #ffffff;
            background: rgba(20, 24, 32, 0.98);
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--glow-gray);
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 20, 24, 0) 50%, rgba(0, 0, 0, 0.85) 50%), 
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.04));
            background-size: 100% 4px, 6px 100%;
            z-index: 10;
            pointer-events: none;
            opacity: 0.8;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.95);
            z-index: 9;
            pointer-events: none;
        }

        #matrix-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            opacity: 0.15;
        }

        /* ОСНОВНОЙ ИНТЕРФЕЙС */
        .interface {
            position: relative;
            z-index: 8;
            width: 92%;
            max-width: 1100px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-gray);
            padding: 35px;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.98), inset 0 0 40px rgba(255, 255, 255, 0.02);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-gray);
            padding-bottom: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 2px;
            border: 1px solid var(--accent-gray);
            background: var(--dark-gray);
            filter: grayscale(100%);
        }

        .user-text {
            font-size: 10px;
            letter-spacing: 2px;
            color: #6b7280;
        }

        .username {
            color: var(--light-gray);
            font-weight: bold;
            font-size: 15px;
        }

        .server-title-box {
            text-align: right;
        }

        .server-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-transform: uppercase;
        }

        .server-sub {
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--accent-gray);
        }

        /* ЦЕНТРАЛЬНЫЙ БЛОК: КАРТА СЕРВЕРА И ТЕРМИНАЛ */
        .content-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .map-card {
            background: var(--dark-gray);
            border: 1px solid var(--border-gray);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .map-preview-container {
            width: 100%;
            height: 170px;
            background: #000;
            border: 1px solid var(--border-gray);
            overflow: hidden;
            position: relative;
        }

        .map-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(120%);
            transition: all 0.5s ease;
        }

        .map-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(5, 6, 8, 0.85);
            padding: 6px 10px;
            font-size: 10px;
            letter-spacing: 1px;
            border-top: 1px solid var(--border-gray);
            display: flex;
            justify-content: space-between;
        }

        .map-details {
            font-size: 11px;
            line-height: 1.6;
            color: #8a92a3;
        }

        .map-details span {
            color: var(--light-gray);
            font-weight: bold;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ВИЗУАЛИЗАТОР */
        .visualizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 45px;
            margin-bottom: 10px;
        }

        .bar {
            width: 6px;
            background: var(--accent-gray);
            opacity: 0.7;
            border-radius: 1px;
            transition: height 0.05s ease;
        }

        /* ТЕРМИНАЛ */
        .terminal {
            background: var(--dark-gray);
            border: 1px solid var(--border-gray);
            padding: 12px;
            height: 135px;
            overflow: hidden;
            font-size: 11px;
            color: #8a92a3;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .terminal-line {
            margin-top: 4px;
            white-space: nowrap;
        }

        .terminal-line::before {
            content: "[Z-CITY] > ";
            color: var(--accent-gray);
            font-weight: bold;
        }

        /* ПРОГРЕСС ЗАГРУЗКИ */
        .progress-section {
            border-top: 1px solid var(--border-gray);
            padding-top: 15px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #8a92a3;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .progress-box {
            width: 100%;
            background: var(--dark-gray);
            border: 1px solid var(--border-gray);
            padding: 3px;
            height: 18px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent-gray);
            transition: width 0.15s ease;
        }

        .footer {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #525a68;
            letter-spacing: 1px;
        }
    </style>
</head>
<body onclick="forceAudio()" onkeydown="forceAudio()">

    <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

    <button class="audio-controls" id="mute-btn" onclick="toggleMusic(event)">
        🔊 [ МУЗЫКА: ВКЛ ]
    </button>

    <div class="scanlines"></div>
    <div class="vignette"></div>
    <canvas id="matrix-canvas"></canvas>

    <div class="interface">
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="header">
            <div class="user-info">
                <img id="avatar" class="avatar" src="https://i.imgur.com/839598X.png" alt="Avatar">
                <div class="user-text">
                    ИГРОК<br>
                    <span id="username" class="username">CONNECTING...</span>
                </div>
            </div>
            <div class="server-title-box">
                <div class="server-name">PARANOIASIM</div>
                <div class="server-sub">UNTIL THE GUNSHOTS FADE // Z-CITY</div>
            </div>
        </div>

        <!-- ЦЕНТРАЛЬНЫЙ БЛОК -->
        <div class="content-grid">
            <!-- КАРТОЧКА КАРТЫ -->
            <div class="map-card">
                <div class="map-preview-container">
                    <img id="map-img" class="map-image" src="https://i.imgur.com/6X2R5sA.png" alt="Map Preview" onerror="this.src='https://i.imgur.com/6X2R5sA.png'">
                    <div class="map-overlay">
                        <span>КАРТА</span>
                        <span id="map-name-tag">RP_ZCITY</span>
                    </div>
                </div>
                <div class="map-details">
                    ТЕКУЩАЯ ЛОКАЦИЯ: <span id="map-display-name">Ожидание сервера...</span><br>
                    РЕЖИМ: <span>Z-CITY / HOMICIDE</span><br>
                    СТАТУС: <span>АКТИВНАЯ ЗОНА</span>
                </div>
            </div>

            <!-- СПРАВА: ВИЗУАЛИЗАТОР И ТЕРМИНАЛ -->
            <div class="right-panel">
                <div class="visualizer" id="visualizer"></div>
                <div class="terminal" id="terminal">
                    <div class="terminal-line">Инициализация клиента Z-City...</div>
                    <div class="terminal-line">Подключение к серверу Garry's Mod...</div>
                </div>
            </div>
        </div>

        <!-- ПРОГРЕСС ЗАГРУЗКИ -->
        <div class="progress-section">
            <div class="progress-header">
                <span id="status">ПОДКЛЮЧЕНИЕ К СЕРВЕРУ...</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-box">
                <div class="progress-bar" id="bar"></div>
            </div>
        </div>

        <div class="footer">
            <div>АВТОР: GOREMAN</div>
            <div id="file-count">ФАЙЛЫ: 0 / 0</div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');
        music.volume = 0.5;

        let audioCtx, analyser, dataArray;
        let audioStarted = false;

        function forceAudio() {
            if (audioStarted) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaElementSource(music);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                renderViz();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            music.play().then(() => {
                audioStarted = true;
                muteBtn.innerText = "🔊 [ МУЗЫКА: ВКЛ ]";
            }).catch(() => {});
        }

        function toggleMusic(e) {
            if (e) e.stopPropagation();
            forceAudio();
            if (music.paused) {
                music.play();
                muteBtn.innerText = "🔊 [ МУЗЫКА: ВКЛ ]";
            } else {
                music.pause();
                muteBtn.innerText = "🔇 [ МУЗЫКА: ВЫКЛ ]";
            }
        }

        // --- ВИЗУАЛИЗАТОР ---
        const viz = document.getElementById('visualizer');
        const bars = [];
        for (let i = 0; i < 30; i++) {
            const b = document.createElement('div');
            b.className = 'bar';
            b.style.height = '4px';
            viz.appendChild(b);
            bars.push(b);
        }

        function renderViz() {
            requestAnimationFrame(renderViz);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            for (let i = 0; i < bars.length; i++) {
                const val = dataArray[i] || 0;
                bars[i].style.height = Math.max(4, (val / 255) * 40) + 'px';
            }
        }

        // --- ТЕРМИНАЛ ЛОГИ ---
        const terminal = document.getElementById('terminal');
        function addLog(text) {
            const line = document.createElement('div');
            line.className = 'terminal-line';
            line.innerText = text;
            terminal.appendChild(line);
            if (terminal.childNodes.length > 5) terminal.removeChild(terminal.firstChild);
        }

        // --- MATRIX BACKGROUND ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = '01ZCITYPARANOIASIM';
        const fontSize = 12;
        const cols = Math.floor(canvas.width / fontSize);
        const drops = Array(cols).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 6, 8, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8a92a3';
            ctx.font = fontSize + 'px monospace';
            for (let i = 0; i < drops.length; i++) {
                const txt = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(txt, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }
        drawMatrix();

        // --- GARRY'S MOD API FUNCTIONS ---
        let totalFilesNeeded = 0;

        function GameDetails(servername, serverurl, mapname, maxplayers, steamid) {
            forceAudio();
            document.getElementById('map-name-tag').innerText = mapname.toUpperCase();
            document.getElementById('map-display-name').innerText = mapname;
            
            // Загрузка миникарты из Steam Workshop/GMod пресетов
            document.getElementById('map-img').src = "https://image.gmod.de/maps/" + mapname + ".jpg";

            if (steamid) {
                document.getElementById('username').innerText = steamid;
            }
            addLog("Карта сервера определена: " + mapname);
        }

        function SetFilesNeeded(needed) {
            totalFilesNeeded = needed;
            document.getElementById('file-count').innerText = "ФАЙЛЫ: 0 / " + totalFilesNeeded;
        }

        function SetFilesRemaining(remaining) {
            forceAudio();
            if (totalFilesNeeded > 0) {
                let downloaded = totalFilesNeeded - remaining;
                let progress = Math.round((downloaded / totalFilesNeeded) * 100);
                document.getElementById('bar').style.width = progress + '%';
                document.getElementById('percent').innerText = progress + '%';
                document.getElementById('file-count').innerText = "ФАЙЛЫ: " + downloaded + " / " + totalFilesNeeded;
            }
        }

        function SetStatusChanged(status) {
            forceAudio();
            document.getElementById('status').innerText = status.toUpperCase();
            addLog(status);
        }
    </script>
</body>
</html>
